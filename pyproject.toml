[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "edric-cli"
version = "0.1.0"
description = "A CLI coding assistant with visible MCP tools and a bounded agent loop"
requires-python = ">=3.12"
dependencies = [
  "mcp==1.30.0",
  "rich==14.3.4",
  "groq==0.37.1",
  "jsonschema==4.26.0",
  "python-dotenv==1.2.4",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.4.0"]
fetch = ["mcp-server-fetch==2026.8.18"]

[project.scripts]
edric = "edric.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
